# No path is hard-coded. Evidence is produced externally by the tracking/evidence pipeline.
models:
  roboengine:
    repo_path: null
    object_model: YxZhang/evf-sam2-multitask
  xmem:
    repo_path: null
    checkpoint: null
  dinov2:
    enabled: false # optional identity evidence; not used by the released curve formula
    checkpoint: null
  sea_raft:
    enabled: true
    repo_path: null
    checkpoint: null
  depth:
    enabled: true
    repo_path: null
    checkpoint: null
curves:
  version: v2
  robust_window_frames: 5
  persistence_frames: 3
  hysteresis_enter: 0.55
  hysteresis_exit: 0.30
  attack_alpha: 0.35
  recovery_alpha: 0.10
  large_post_smoothing: false
  label_leakage: false
  group_aggregation: mean_available_instance_evidence
  tracking_failure_policy: reliability_gated_temporal_hold
